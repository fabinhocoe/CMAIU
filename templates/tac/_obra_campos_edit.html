<!-- Campos de edição de obra inline – reutiliza o mesmo layout que _obra_campos.html mas sem widget de busca -->
<div class="row g-2">
  <div class="col-md-6">
    <label class="form-label small fw-semibold">Descrição</label>
    <input type="text" name="descricao" class="form-control form-control-sm"
      value="{{ o.descricao or '' }}" placeholder="Ex: Residência principal">
  </div>
  <div class="col-md-6">
    <label class="form-label small fw-semibold">Endereço</label>
    <input type="text" name="endereco" class="form-control form-control-sm"
      value="{{ o.endereco or '' }}">
  </div>
  <div class="col-md-4">
    <label class="form-label small fw-semibold">Bairro</label>
    <input type="text" name="bairro" class="form-control form-control-sm"
      value="{{ o.bairro or '' }}">
  </div>
  <div class="col-md-4">
    <label class="form-label small fw-semibold">Inscrição Imobiliária</label>
    <input type="text" name="inscricao" class="form-control form-control-sm"
      placeholder="00.00.000.0000" maxlength="14"
      oninput="mascaraInscricao(this)"
      value="{{ o.inscricao_imobiliaria|fmt_inscricao if o.inscricao_imobiliaria else '' }}">
  </div>
  <div class="col-md-4">
    <label class="form-label small fw-semibold">Grupo <span class="text-danger">*</span></label>
    <select name="grupo" class="form-select form-select-sm" required>
      {% for cod, label in grupos %}
      <option value="{{ cod }}" {% if o.grupo == cod %}selected{% endif %}>{{ label }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="col-md-4">
    <label class="form-label small fw-semibold">Área Construída (m²) <span class="text-danger">*</span></label>
    <input type="number" step="0.01" name="area_construida" class="form-control form-control-sm"
      value="{% if o.area_construida is not none %}{{ o.area_construida }}{% endif %}" required>
  </div>
  <div class="col-md-4">
    <label class="form-label small fw-semibold">Data da Construção</label>
    <input type="date" name="data_construcao" class="form-control form-control-sm"
      value="{{ o.data_construcao.isoformat() if o.data_construcao else '' }}">
    <div class="form-text">Determina FA e FR</div>
  </div>
  <div class="col-md-4 d-flex align-items-end pb-1">
    <div class="form-check">
      <input type="checkbox" class="form-check-input" name="is_unifamiliar_ate150"
        id="uniChk_{{ o.id }}"
        {% if o.is_unifamiliar_ate150 %}checked{% endif %}>
      <label class="form-check-label small" for="uniChk_{{ o.id }}">
        Unifamiliar ≤ 150 m² (fator 0,50)
      </label>
    </div>
  </div>
  <div class="col-12">
    <label class="form-label small fw-semibold">Observações</label>
    <textarea name="observacoes" class="form-control form-control-sm" rows="2">{{ o.observacoes or '' }}</textarea>
  </div>
</div>
