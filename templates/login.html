<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CMAIU – Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body class="login-body d-flex align-items-center justify-content-center min-vh-100">
<div class="login-card card shadow-lg p-4" style="width:380px;max-width:95vw">
  <div class="text-center mb-4">
    <img src="{{ url_for('static', filename='img/smpu_logo.png') }}" alt="Prefeitura Municipal de Palhoça" class="mb-3" style="max-height:90px;max-width:100%">
    <p class="text-muted small mb-0">Prefeitura Municipal de Palhoça</p>
  </div>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}
      <div class="alert alert-{{ cat }} py-2 small">{{ msg }}</div>
    {% endfor %}
  {% endwith %}
  <form method="POST">
    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3">
      <label class="form-label small fw-semibold">E-mail</label>
      <input type="email" name="email" class="form-control" required autofocus>
    </div>
    <div class="mb-4">
      <label class="form-label small fw-semibold">Senha</label>
      <input type="password" name="senha" class="form-control" required>
    </div>
    <button type="submit" class="btn btn-primary w-100 fw-semibold">
      <i class="bi bi-box-arrow-in-right me-2"></i>Entrar
    </button>
  </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
