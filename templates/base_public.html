<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}CMAIU{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/static/css/style.css" rel="stylesheet">
  <style>
    /* Usar as mesmas cores do aplicativo CMAIU */
    :root {
      --color-primary: #1a3a5c;
      --color-accent: #2060a0;
      --color-bg: #f4f6f9;
      --section-header-bg: #eef2f7;
      --card-radius: 10px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      background: var(--color-bg);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-size: .875rem;
    }

    .public-wrapper {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Header */
    .public-header {
      background: white;
      border-bottom: 1px solid #dde4ed;
      padding: 1.5rem 1rem;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
      text-align: center;
    }

    .public-header-content {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
    }

    .header-logo-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
    }

    .header-logo {
      max-height: 90px;
      max-width: 100%;
      object-fit: contain;
    }

    .header-info {
      text-align: center;
    }

    .header-info h1 {
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--color-primary);
      margin: 0;
      letter-spacing: .03em;
    }

    .header-info p {
      font-size: .82rem;
      color: #4a5568;
      margin: 0.25rem 0 0 0;
    }

    .header-link {
      font-size: .82rem;
      color: var(--color-accent);
      text-decoration: none;
      font-weight: 500;
    }

    .header-link:hover {
      text-decoration: underline;
    }

    /* Conteúdo principal */
    .public-content {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .content-container {
      width: 100%;
      max-width: 520px;
    }

    /* Footer */
    .public-footer {
      background: white;
      border-top: 1px solid #dde4ed;
      padding: 1.25rem;
      text-align: center;
      font-size: .78rem;
      color: #4a5568;
      box-shadow: 0 -1px 4px rgba(0, 0, 0, 0.06);
    }

    .public-footer a {
      color: var(--color-accent);
      text-decoration: none;
    }

    .public-footer a:hover {
      text-decoration: underline;
    }

    /* Card do formulário */
    .form-card {
      background: white;
      border: none;
      border-radius: var(--card-radius);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
      overflow: hidden;
    }

    .form-card .card-header {
      background: var(--section-header-bg);
      color: var(--color-primary);
      border-bottom: 1px solid #dde4ed;
      border-radius: 0;
      padding: .55rem 1rem;
      font-weight: 600;
      font-size: .82rem;
      letter-spacing: .03em;
    }

    .form-card .card-body {
      padding: 1.25rem 1rem;
    }

    /* Labels */
    .form-label {
      color: #374151;
      font-weight: 500;
      font-size: .875rem;
      margin-bottom: 0.4rem;
    }

    .form-label.fw-semibold {
      color: #374151;
    }

    /* Inputs */
    .form-control, .form-select {
      border-radius: 4px;
      font-size: .875rem;
    }

    .form-control:read-only,
    .form-control[readonly] {
      background: #f1f5f9;
    }

    .form-control:focus, .form-select:focus {
      border-color: var(--color-accent);
      box-shadow: 0 0 0 3px rgba(32, 96, 160, 0.1);
    }

    .form-text {
      font-size: .78rem;
      color: #4a5568;
      margin-top: 0.3rem;
    }

    .section-divider {
      margin: 1rem 0;
      border: none;
      border-top: 1px solid #e5e9f0;
    }

    .section-title {
      font-size: .82rem;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--color-primary);
      margin-top: 1rem;
      margin-bottom: .75rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      letter-spacing: .03em;
    }

    .section-title i {
      font-size: .9rem;
    }

    /* Botões */
    .btn-primary {
      background: var(--color-accent);
      border: none;
      font-weight: 500;
      font-size: .875rem;
    }

    .btn-primary:hover {
      background: #1a4d7a;
    }

    .btn-outline-secondary {
      border: 1px solid #dde4ed;
      color: #4a5568;
      font-weight: 500;
      font-size: .875rem;
    }

    .btn-outline-secondary:hover {
      background: var(--color-bg);
      border-color: #cbd5e1;
    }

    /* Alertas */
    .alert {
      border-radius: 8px;
      font-size: .875rem;
      margin-bottom: 1rem;
    }

    .alert-info {
      border-left: 4px solid #0dcaf0;
      background: #f0faff;
      color: #055160;
    }

    .alert-danger {
      border-left: 4px solid #dc3545;
      background: #fff5f5;
      color: #842029;
    }

    .alert-success {
      border-left: 4px solid #198754;
      background: #f0fff4;
      color: #0f5132;
    }

    /* Validação de senha */
    .password-feedback {
      font-size: .78rem;
      margin-top: 0.3rem;
      display: none;
      color: #dc3545;
    }

    .form-control.is-invalid {
      border-color: #dc3545 !important;
    }

    /* Responsive */
    @media (min-width: 768px) {
      .public-header-content {
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
      }

      .header-logo-section {
        flex-direction: row;
      }

      .header-info {
        text-align: left;
      }

      .header-info h1 {
        font-size: 1rem;
      }
    }

    @media (max-width: 767px) {
      .form-card .card-body {
        padding: 1rem;
      }

      .header-logo {
        max-height: 70px;
      }
    }
  </style>
</head>
<body>
  <div class="public-wrapper">
    <!-- Header -->
    <header class="public-header">
      <div class="public-header-content">
        <div class="header-logo-section">
          <img src="{{ url_for('static', filename='img/smpu_logo.jpg') }}" alt="Prefeitura Municipal de Palhoça" class="header-logo">
          <div class="header-info">
            <h1>CMAIU</h1>
            <p>Prefeitura Municipal de Palhoça - SC</p>
          </div>
        </div>
        <a href="{{ url_for('login') }}" class="header-link">
          <i class="bi bi-box-arrow-in-right"></i> Já tenho conta? Fazer Login
        </a>
      </div>
    </header>

    <!-- Conteúdo -->
    <div class="public-content">
      <div class="content-container">
        {% block content %}{% endblock %}
      </div>
    </div>

    <!-- Footer -->
    <footer class="public-footer">
      <p>
        <i class="bi bi-shield-check"></i>
        Formulário seguro e protegido por CSRF Token
        <br>
        <small>© 2024-2026 Secretaria Municipal de Planejamento Urbano</small>
      </p>
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
